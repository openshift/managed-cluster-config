apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-config
  namespace: openshift-machine-api-observability
data:
  custom-resource-state.yaml: |
    spec:
      resources:
        - groupVersionKind:
            group: machine.openshift.io
            version: v1beta1
            kind: MachineSet
          metricNamePrefix: mapi_machine_set
          labelsFromPath:
            name:
              - metadata
              - name
            namespace:
              - metadata
              - namespace
          metrics:
            - name: "spec_info"
              help: "Static spec-derived info for a machineset including spot market configuration"
              each:
                type: Info
                info:
                    labelsFromPath:
                      # Extract instance type for reference
                      instance_type: [spec, template, spec, providerSpec, value, instanceType]
                      # Extract spot market max price - if this label exists, it's a spot instance
                      # The maxPrice value can be empty (means use current on-demand price as max)
                      # We use label presence (not value) to detect spot instances in alerts
                      spot_market_max_price: [spec, template, spec, providerSpec, value, spotMarketOptions, maxPrice]
