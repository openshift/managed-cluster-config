apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: sre-infra-per-node-resizing-alerts
    role: alert-rules
  name: sre-infra-per-node-resizing-alerts
  namespace: openshift-monitoring
spec:
  groups:
  - name: sre-infra-per-node-resource-consumption-recording.rules
    rules:
    ## Per-node CPU utilization for infra nodes.
    ## Computes the average CPU utilization (non-idle) across all cores on each infra node over the past 5m.
    ## Joins with sre:telemetry:managed_labels to pick up _id for centralized observability.
    ## Returns a value between 0 and 1 per infra node instance.
      - expr: |
            (
              avg by (instance) (
                sum by (cpu, instance) (
                  rate(node_cpu_seconds_total{mode!="idle"}[5m])
                )
              )
              * on (instance) (
                label_replace(
                  kube_node_role{role="infra"}, "instance", "$1", "node", "(.*)"
                )
              )
            )
            * on () group_left (_id)
            sre:telemetry:managed_labels
        record: sre:node_infra:cpu_utilization_per_node
    ## Per-node memory utilization for infra nodes.
    ## Computes 1 - (free + buffers + cached) / total for each infra node.
    ## Joins with sre:telemetry:managed_labels to pick up _id for centralized observability.
    ## Returns a value between 0 and 1 per infra node instance.
    ## Uses last_over_time to carry forward the last known value across scrape gaps
    ## of up to 10 minutes, preventing MemoryPressure-induced scrape failures from
    ## resetting downstream alert 'for' timers.
      - expr: |
            (
              (
                1 -
                (last_over_time(node_memory_MemFree_bytes[10m]) + last_over_time(node_memory_Buffers_bytes[10m]) + last_over_time(node_memory_Cached_bytes[10m]))
                / last_over_time(node_memory_MemTotal_bytes[10m])
              )
              * on (instance) (
                label_replace(
                  kube_node_role{role="infra"}, "instance", "$1", "node", "(.*)"
                )
              )
            )
            * on () group_left (_id)
            sre:telemetry:managed_labels
        record: sre:node_infra:memory_utilization_per_node
  - name: sre-infra-per-node-resizing-alerts
    rules:
    ##
    ## Extreme tier: Individual node critical utilization.
    ## Singleton alerts fire when any infra node exceeds 90% utilization but
    ## fewer than N-1 nodes are affected — indicates an anomalous workload on
    ## a specific node rather than the cluster outgrowing its capacity.
    ## N-1 extreme alerts fire when N-1 or more nodes exceed 90% — indicates
    ## the cluster is critically undersized and needs an urgent resize.
    ## These two classes are mutually exclusive by definition.
    ##
    ## On 2-node (single-AZ) clusters, N-1 = 1, so the singleton condition
    ## (count < 1) is never satisfied; all breaches route to the N-1 path.
    ##
      - alert: ExtremelyHighIndividualInfraNodeCPUSRE
        expr: |
          count(sre:node_infra:cpu_utilization_per_node > 0.90) >= 1
          and
          count(sre:node_infra:cpu_utilization_per_node > 0.90)
          <
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 45m
        labels:
          severity: critical
          namespace: openshift-monitoring
        annotations:
          summary: "Infra node above 90% CPU for 45 minutes"
          description: "An infrastructure node has had CPU utilization above 90% for 45 minutes, but fewer than N-1 nodes are affected. This indicates anomalous resource consumption on a specific node rather than a cluster-wide capacity issue. Investigate the node's workloads."
          runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/ExtremelyHighIndividualInfraNodeCPUSRE.md
      - alert: ExtremelyHighIndividualInfraNodeMemorySRE
        expr: |
          count(sre:node_infra:memory_utilization_per_node > 0.90) >= 1
          and
          count(sre:node_infra:memory_utilization_per_node > 0.90)
          <
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 30m
        labels:
          severity: critical
          namespace: openshift-monitoring
        annotations:
          summary: "Infra node above 90% memory for 30 minutes"
          description: "An infrastructure node has had memory utilization above 90% for 30 minutes, but fewer than N-1 nodes are affected. This indicates anomalous resource consumption on a specific node rather than a cluster-wide capacity issue. Investigate the node's workloads."
          runbook_url: https://github.com/openshift/ops-sop/blob/master/v4/alerts/ExtremelyHighIndividualInfraNodeMemorySRE.md
      - alert: cpu-InfraNodesExcessiveResourceConsumptionPerNodeSRE45m
        expr: |
          count(sre:node_infra:cpu_utilization_per_node > 0.90)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 45m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 90% CPU for 45 minutes"
          description: "At least N-1 infrastructure nodes have had CPU utilization above 90% for 45 minutes. The cluster is critically undersized and infrastructure nodes should be resized urgently."
      - alert: memory-InfraNodesExcessiveResourceConsumptionPerNodeSRE30m
        expr: |
          count(sre:node_infra:memory_utilization_per_node > 0.90)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 30m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 90% memory for 30 minutes"
          description: "At least N-1 infrastructure nodes have had memory utilization above 90% for 30 minutes. The cluster is critically undersized and infrastructure nodes should be resized urgently."
    ##
    ## Tier 1: Initial threshold breach warnings.
    ## These fire after 10m to confirm the condition is not a momentary blip.
    ##
      - alert: cpu-InfraNodesExcessiveResourceConsumptionPerNodeSRE1h
        expr: |
          count(sre:node_infra:cpu_utilization_per_node > 0.85)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 10m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 85% CPU for 10 minutes"
          description: "At least N-1 infrastructure nodes have had CPU utilization above 85% for 10 minutes."
      - alert: cpu-InfraNodesExcessiveResourceConsumptionPerNodeSRE12h
        expr: |
          count(sre:node_infra:cpu_utilization_per_node > 0.75)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 10m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 75% CPU for 10 minutes"
          description: "At least N-1 infrastructure nodes have had CPU utilization above 75% for 10 minutes."
      - alert: memory-InfraNodesExcessiveResourceConsumptionPerNodeSRE1h
        expr: |
          count(sre:node_infra:memory_utilization_per_node > 0.80)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 10m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 80% memory for 10 minutes"
          description: "At least N-1 infrastructure nodes have had memory utilization above 80% for 10 minutes."
      - alert: memory-InfraNodesExcessiveResourceConsumptionPerNodeSRE12h
        expr: |
          count(sre:node_infra:memory_utilization_per_node > 0.70)
          >=
          count(cluster:nodes_roles{label_node_role_kubernetes_io="infra"}) - 1
        for: 10m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "N-1 infra nodes above 70% memory for 10 minutes"
          description: "At least N-1 infrastructure nodes have had memory utilization above 70% for 10 minutes."
    ##
    ## Tier 2: Sustained threshold breach warnings.
    ## These fire after the tier 1 warning has persisted for the full reference window.
    ##
      - alert: cpu-InfraNodesNeedResizingSRE1h
        expr: |
          count(ALERTS{alertname="cpu-InfraNodesExcessiveResourceConsumptionPerNodeSRE1h", alertstate="firing"}) >= 1
        for: 50m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "Infra nodes need resizing due to sustained high CPU"
          description: "At least N-1 infrastructure nodes have had CPU utilization above 85% for 1 hour. Infrastructure nodes should be resized."
      - alert: cpu-InfraNodesNeedResizingSRE12h
        expr: |
          count(ALERTS{alertname="cpu-InfraNodesExcessiveResourceConsumptionPerNodeSRE12h", alertstate="firing"}) >= 1
        for: 11h50m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "Infra nodes need resizing due to extended high CPU"
          description: "At least N-1 infrastructure nodes have had CPU utilization above 75% for 12 hours. Infrastructure nodes should be resized."
      - alert: memory-InfraNodesNeedResizingSRE1h
        expr: |
          count(ALERTS{alertname="memory-InfraNodesExcessiveResourceConsumptionPerNodeSRE1h", alertstate="firing"}) >= 1
        for: 50m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "Infra nodes need resizing due to sustained high memory"
          description: "At least N-1 infrastructure nodes have had memory utilization above 80% for 1 hour. Infrastructure nodes should be resized."
      - alert: memory-InfraNodesNeedResizingSRE12h
        expr: |
          count(ALERTS{alertname="memory-InfraNodesExcessiveResourceConsumptionPerNodeSRE12h", alertstate="firing"}) >= 1
        for: 11h50m
        labels:
          severity: warning
          namespace: openshift-monitoring
        annotations:
          summary: "Infra nodes need resizing due to extended high memory"
          description: "At least N-1 infrastructure nodes have had memory utilization above 70% for 12 hours. Infrastructure nodes should be resized."
