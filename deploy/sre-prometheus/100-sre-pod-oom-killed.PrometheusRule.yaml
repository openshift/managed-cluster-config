apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: sre-pod-oom-killed
    role: alert-rules
  name: sre-pod-oom-killed
  namespace: openshift-monitoring
spec:
  groups:
  - name: sre-pod-oom-killed
    rules:
    - alert: UserPodOOMKilledSRE
      expr: sum(kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace!="(openshift|kube).*"}) by (pod,namespace) > 0
      for: 1m
      labels:
        severity: critical
        namespace: openshift-monitoring
      annotations:
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} was OOMKilled. This may indicate that the pod is consuming excessive memory and may need to be investigated."
