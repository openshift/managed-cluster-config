deploymentMode: "SelectorSyncSet"
selectorSyncSet:
  resourceApplyMode: "Sync"
  matchExpressions:
  - key: api.openshift.com/product
    operator: In
    values:
      - "rosa"
  - key: ext-hypershift.openshift.io/cluster-type
    operator: NotIn
    values:
      - "management-cluster"
      - "service-cluster"
  - key: api.openshift.com/fedramp
    operator: NotIn
    values:
      - "true"
# Target ROSA Classic clusters only - match ManagedNotification template deployment scope
# This prevents "no managed notification found" errors on OSD/FedRAMP/HyperShift clusters
