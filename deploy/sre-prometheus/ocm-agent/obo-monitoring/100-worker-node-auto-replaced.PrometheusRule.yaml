---
apiVersion: monitoring.rhobs/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: worker-node-auto-replaced
    role: alert-rules
  name: worker-node-auto-replaced
  namespace: openshift-observability-rhobs
spec:
  groups:
    - name: worker-node-auto-replaced
      interval: 60s
      rules:
        - alert: WorkerNodeAutoReplacedNotification
          annotations:
            summary: "Worker node automatically replaced by MachineHealthCheck"
            description: "MachineHealthCheck flagged worker node {{ $labels.machine_name }} of cluster {{ $labels._id }} as unhealthy; the customer is notified via service log."
          expr: |-
            label_replace(
              label_replace(
                last_over_time(capi_machine_info{healthcheck_succeeded="False",owner_remediated="False"}[10m]),
                "nodepool_name", "$1", "machine_name", "^(.*)-[^-]+-[^-]+$"
              ),
              "hc_namespace", "$1-$2-$3", "exported_namespace", "^(.*?)-(.*?)-(.*?)-.*$"
            )
            * on (hc_namespace, nodepool_name) group_left(_id)
            group by (hc_namespace, nodepool_name, _id) (
              label_replace(
                label_replace(hypershift_nodepools_size, "hc_namespace", "$1", "exported_namespace", "(.*)"),
                "nodepool_name", "$1", "name", "(.*)"
              )
            )
            unless on (_id) hypershift_cluster_alerts_disabled
          labels:
            severity: info
            send_managed_notification: "true"
            managed_notification_template: worker-node-auto-replaced
            namespace: "{{ $labels.namespace }}"
