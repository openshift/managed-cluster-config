---
apiVersion: monitoring.rhobs/v1
kind: PrometheusRule
metadata:
  labels:
    prometheus: worker-node-auto-replaced
    role: alert-rules
  name: worker-node-auto-replaced
  namespace: openshift-observability-rhobs
spec:
  groups:
    - name: worker-node-auto-replaced
      interval: 60s
      rules:
        # https://redhat.atlassian.net/browse/MCS-1494
        #
        # healthcheck_succeeded="False" is CAPI MachineHealthCheck's own condition on the Machine.
        # last_over_time keeps the series for 10m after the Machine object is deleted.
        #
        # capi_machine_info carries the HCP namespace (ocm-<env>-<id>-<name>) in exported_namespace,
        # while the hypershift_nodepool_* metrics carry the hosted cluster namespace (ocm-<env>-<id>),
        # so the first label_replace derives the latter. The second derives the NodePool name from
        # the machine name (<nodepool>-<hash>-<suffix>).
        #
        # TODO(MCS-1494): no HostedCluster/NodePool-level "upgrade in progress" signal is exposed yet,
        # so replacements during a NodePool upgrade are currently notified.
        #
        # TODO(MCS-1494): the spot exclusion drops every machine of a Spot NodePool, not only
        # reclamations like Classic. It also relies on hypershift_nodepool_spec_info{market_type},
        # which could not be verified on a 4.19 hosted cluster (no NodePool there sets marketType).
        - alert: WorkerNodeAutoReplacedNotification
          annotations:
            summary: "Worker node automatically replaced by MachineHealthCheck"
            description: "MachineHealthCheck flagged worker node {{ $labels.machine_name }} of cluster {{ $labels._id }} as unhealthy; the customer is notified via service log."
          expr: |-
            label_replace(
              label_replace(
                last_over_time(capi_machine_info{healthcheck_succeeded="False"}[10m]),
                "nodepool_name", "$1", "machine_name", "^(.*)-[^-]+-[^-]+$"
              ),
              "hc_namespace", "$1-$2-$3", "exported_namespace", "^(.*?)-(.*?)-(.*?)-.*$"
            )
            unless on (hc_namespace, nodepool_name) label_replace(
              hypershift_nodepool_spec_info{market_type="Spot"},
              "hc_namespace", "$1", "exported_namespace", "(.*)"
            )
            unless on (_id) hypershift_cluster_alerts_disabled
          labels:
            severity: info
            send_managed_notification: "true"
            managed_notification_template: worker-node-auto-replaced
            namespace: "{{ $labels.namespace }}"
