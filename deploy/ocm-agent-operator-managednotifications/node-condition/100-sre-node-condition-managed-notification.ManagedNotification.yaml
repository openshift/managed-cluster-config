apiVersion: ocmagent.managed.openshift.io/v1alpha1
kind: ManagedNotification
metadata:
  name: sre-node-condition-managed-notification
  namespace: openshift-ocm-agent-operator
spec:
  notifications:
    # available conditions: https://kubernetes.io/docs/reference/node/node-status/#condition 
    - name: NodeConditionNotification
      severity: Moderate
      summary: "Worker node is experiencing ${condition}"
      activeBody: |-
        ${condition} condition is true for at least one worker.${explanation} For more information, consult the relevant ROSA documentation here: ${documentation}.
      resolvedBody: |-
        ${condition} condition is resolved.
      resendWait: 6
    - name: WorkerNodeAutoReplaced
      severity: Low
      logType: Cluster Lifecycle
      summary: "Worker node automatically replaced"
      activeBody: |-
        Red Hat's automated health checks detected one or more unhealthy worker nodes in your cluster and replaced them with new nodes. For more information, refer to the following article: https://access.redhat.com/solutions/7066033. Further replacements within 24 hours are not notified individually.
      references:
        - "https://access.redhat.com/solutions/7066033"
      resendWait: 24
