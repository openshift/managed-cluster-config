apiVersion: ocmagent.managed.openshift.io/v1alpha1
kind: ManagedNotification
metadata:
  name: sre-node-condition-managed-notification
  namespace: openshift-ocm-agent-operator
spec:
  notifications:
    # available conditions: https://kubernetes.io/docs/reference/node/node-status/#condition 
    - name: NodeConditionNotification
      severity: Moderate
      summary: "Worker node is experiencing ${condition}"
      activeBody: |-
        ${condition} condition is true for at least one worker.${explanation} For more information, consult the relevant ROSA documentation here: ${documentation}.
      resolvedBody: |-
        ${condition} condition is resolved.
      resendWait: 6
    # https://redhat.atlassian.net/browse/MCS-36
    # No resolvedBody: a replacement does not resolve, so only the firing service log is sent.
    - name: WorkerNodeAutoReplaced
      severity: Low
      logType: Cluster Lifecycle
      summary: "Worker node automatically replaced"
      activeBody: |-
        Red Hat's automated health checks detected that one or more worker nodes in your cluster stopped reporting Ready for more than 8 minutes, and initiated their replacement with new nodes from the same machine pool. Pods on the affected nodes are rescheduled to other nodes when scheduling constraints and capacity allow; pods that cannot be placed remain Pending. Workloads running a single replica may have experienced a brief disruption. A frequent cause of nodes becoming NotReady is resource exhaustion from workloads without resource requests and limits. To identify the replaced node and make your applications resilient to node replacement, see https://access.redhat.com/solutions/7066033. Further replacements within 24 hours are not notified individually. If replacements recur, please open a support case.
      references:
        - "https://access.redhat.com/solutions/7066033"
      resendWait: 24
