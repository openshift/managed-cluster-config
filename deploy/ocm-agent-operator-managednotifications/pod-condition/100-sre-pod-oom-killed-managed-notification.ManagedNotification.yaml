apiVersion: ocmagent.managed.openshift.io/v1alpha1
kind: ManagedNotification
metadata:
  name: sre-node-condition-managed-notification
  namespace: openshift-ocm-agent-operator
spec:
  notifications:
    - name: PodOOMKilledNotification
      severity: Moderate
      summary: Pods are OOMKilled
      activeBody: |-
        Pod termination due to insufficient memory is detected in your cluster. For more information refer to the following article: https://access.redhat.com/kb/7034300.
      references:
      - "https://access.redhat.com/kb/7034300"
