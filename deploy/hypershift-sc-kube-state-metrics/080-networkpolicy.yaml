apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: hypershift-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # RHOBS / Observability Operator scrape (ServiceMonitor monitoring.rhobs/v1).
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  # Kubelet liveness/readiness probes (host-network).
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: host-network
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  # CoreDNS in openshift-dns (port 5353).
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
    ports:
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  # Kubernetes API (host-networked; KSM custom-resource-state).
  - ports:
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 443
