---
apiVersion: ocmagent.managed.openshift.io/v1alpha1
kind: ManagedFleetNotification
metadata:
  name: worker-node-auto-replaced
  namespace: openshift-ocm-agent-operator
spec:
  fleetNotification:
    name: worker-node-auto-replaced
    summary: "Worker node automatically replaced"
    notificationMessage: |-
      OpenShift's Machine Health Check detected one or more unhealthy worker nodes in your cluster and replaced them with new nodes. For more information, refer to the following article: https://access.redhat.com/solutions/7066033. Further replacements within 24 hours are not notified individually.
    logType: "Cluster Lifecycle"
    references:
      - "https://access.redhat.com/solutions/7066033"
    resendWait: 24
    severity: Low
    limitedSupport: false
