deploymentMode: "SelectorSyncSet"
selectorSyncSet:
  resourceApplyMode: "Sync"
  matchExpressions:
  - key: hive.openshift.io/version-major-minor
    operator: In
    values: ["4.19", "4.20", "4.21"]
  - key: hive.openshift.io/cluster-platform
    operator: In
    values: ["aws"]
  # Include FedRAMP AWS OSD clusters in the 4.19-4.21 rule.
  - key: api.openshift.com/product
    operator: NotIn
    values: ["rosa"]
