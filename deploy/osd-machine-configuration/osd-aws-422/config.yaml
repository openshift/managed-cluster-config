deploymentMode: "SelectorSyncSet"
selectorSyncSet:
  resourceApplyMode: "Sync"
  matchExpressions:
  # Keep this allowlist limited to supported OpenShift releases. Add new releases as they become supported.
  - key: hive.openshift.io/version-major-minor
    operator: In
    values: ["4.22", "5.0"]
  - key: hive.openshift.io/cluster-platform
    operator: In
    values: ["aws"]
  - key: api.openshift.com/product
    operator: NotIn
    values: ["rosa"]
  - key: api.openshift.com/fedramp
    operator: NotIn
    values: ["true"]
